# Builds the backhaul binary for Linux and publishes it as the rolling
# "backhaul-latest" release, so install.sh can download it instead of needing Go.
name: backhaul release

on:
  push:
    branches: [main]
    paths:
      - "backhaul/**"
      - ".github/workflows/backhaul-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backhaul-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backhaul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backhaul/go.mod
          cache-dependency-path: backhaul/go.sum

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64 386 arm; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o ../dist/backhaul-linux-$arch .
          done
          cd ../dist && sha256sum backhaul-linux-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          gh release delete backhaul-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create backhaul-latest backhaul-linux-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "backhaul (latest build)" \
            --notes "Prebuilt backhaul binaries for Linux, built from ${GITHUB_SHA}. Downloaded automatically by install.sh."
